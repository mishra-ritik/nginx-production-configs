# Serving a built React/Vue/Angular single-page app from /usr/share/nginx/html
# with correct caching, SPA fallback, and gzip. Drop-in for the nginx Docker image.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    server {
        listen 80;
        server_name _;
        root  /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # Fingerprinted build assets: cache for a year
        location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # index.html must never be cached so new deploys show immediately
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA fallback: unknown routes are handled by the client-side router
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
